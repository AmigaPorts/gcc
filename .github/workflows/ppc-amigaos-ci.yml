name: ppc-amigaos toolchain

# Builds the AmigaOS 4 (PowerPC) cross toolchain from this tree: binutils
# from AmigaPorts/binutils-gdb, the AmigaOS SDK, clib2 and clib4 (both built
# with the new compiler, as adtools does), then gcc with its runtime
# libraries, and links test programs for each C runtime.  The steps are in
# .github/ppc-amigaos/ci.sh, the test programs in .github/ppc-amigaos/tests.
#
# It runs when a pull request gets the ci-linux-ppc label (re-add the label
# to rebuild), or by hand from the Actions tab.  The m68k toolchain build
# ignores that label.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      binutils_ref:
        description: AmigaPorts/binutils-gdb ref with ppc-amigaos support
        default: stefan/ppc-amigaos-2.46

env:
  TARGET: ppc-amigaos
  PREFIX: ${{ github.workspace }}/prefix
  BINUTILS_REPO: https://github.com/AmigaPorts/binutils-gdb.git
  BINUTILS_REF: ${{ inputs.binutils_ref || 'stefan/ppc-amigaos-2.46' }}
  # clib2 as pinned by adtools; clib4 2.5, the first with gcc 15+ fixes.
  CLIB2_REPO: https://github.com/sodero/clib2.git
  CLIB2_REF: 1a42c693e03881f6f969c43ab36ce20d2569751d
  CLIB4_REPO: https://github.com/AmigaLabs/clib4.git
  CLIB4_REF: c640af22a7eea76260ac6ab631fb01ca96870576
  SDK_VERSION: "54.16"
  SDK_URL: https://www.hyperion-entertainment.com/index.php?option=com_registration&view=download&format=raw&file=127
  # Under the amigaos thread model __gthread_cond_t is not a pthread object.
  glibcxx_cv_PTHREAD_COND_CLOCKWAIT: "no"

jobs:
  ppc-amigaos:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci-linux-ppc'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out gcc
        uses: actions/checkout@v7
        with:
          path: gcc
          # For a pull request, GitHub's merge of it into its base branch.
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}

      - name: Install build dependencies
        run: gcc/.github/ppc-amigaos/ci.sh deps

      - name: Build lha
        run: gcc/.github/ppc-amigaos/ci.sh lha

      - name: Cache the AmigaOS SDK
        uses: actions/cache@v6
        with:
          path: SDK_${{ env.SDK_VERSION }}.lha
          key: amigaos-sdk-${{ env.SDK_VERSION }}

      - name: Build binutils
        run: gcc/.github/ppc-amigaos/ci.sh binutils

      - name: Install the AmigaOS SDK
        run: gcc/.github/ppc-amigaos/ci.sh sdk

      - name: Configure gcc and build the bootstrap compiler
        run: gcc/.github/ppc-amigaos/ci.sh bootstrap

      - name: Build clib2 and clib4
        run: gcc/.github/ppc-amigaos/ci.sh clibs

      - name: Build gcc and its runtime libraries
        run: gcc/.github/ppc-amigaos/ci.sh gcc

      - name: Link test programs
        run: gcc/.github/ppc-amigaos/ci.sh test
